# Increase Gradle JVM heap to avoid D8 OOM during dex merging
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Limit parallel workers to reduce peak memory
org.gradle.workers.max=2

# Increase Kotlin daemon memory
kotlin.daemon.jvmargs=-Xmx2g

# Use full classpath for dexing transforms (AGP 8.3+)
android.useFullClasspathForDexingTransform=true

# AndroidX flags (defaults true in new projects but keep explicit)
android.useAndroidX=true
android.enableJetifier=true
